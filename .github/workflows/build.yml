name: Build Geode mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          path: .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Input-Buffer-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
